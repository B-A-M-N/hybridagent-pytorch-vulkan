# pyproject for the torch_vulkan_ext extension package.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-vulkan-ext"
version = "0.1.0"
description = "Raw-Vulkan transformer kernels for PyTorch PrivateUse1 (torch-vulkan)"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools]
packages = ["torch_vulkan_ext"]
